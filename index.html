<script>
  document.addEventListener("DOMContentLoaded", function () {
    const letterNow = [
      "s",
      "t",
      "u",
      "v",
      "w",
      "x",
      "y",
      "z",
    ]

    const container = document.getElementById("link-list-container")
    let htmlContent = ""
    let listIndex = 0

    const priorityLinks = [
      {
        copyText: "http://jpdjmix.com/dj",
        href: "http://jpdjmix.com/dj",
        displayHtml: "http://jpdjmix.com/dj",
      },
      {
        copyText: "http://jpdjhub.com/dj",
        href: "http://jpdjhub.com/dj",
        displayHtml: "http://jpdjhub.com/dj",
      },
      {
        copyText: "jpdjecho.com",
        href: "https://jpdjecho.com",
        displayHtml: "jpdjecho.com",
      },
      {
        copyText: "jpdjremix.com",
        href: "https://jpdjremix.com",
        displayHtml: "jpdjremix.com",
      },
      {
        copyText: "http://dj-come.com/dj",
        href: "http://dj-come.com/dj",
        displayHtml: "http://dj-come.com/dj",
      },
      {
        copyText: "http://facaidj.com/jp",
        href: "http://facaidj.com/jp",
        displayHtml: "http://facaidj.com/jp",
      },
      {
        copyText: "http://faca-idj.com/jp",
        href: "http://faca-idj.com/jp",
        displayHtml: "http://faca-idj.com/jp",
      },
      {
        copyText: "http://facaidjs.com/jp",
        href: "http://facaidjs.com/jp",
        displayHtml: "http://facaidjs.com/jp",
      },
      {
        copyText: "http://mydjlove.com/tz",
        href: "http://mydjlove.com/tz",
        displayHtml: "http://mydjlove.com/tz",
      },
      {
        copyText: "http://djloveit.com/tz",
        href: "http://djloveit.com/tz",
        displayHtml: "http://djloveit.com/tz",
      },
      {
        copyText: "http://djfacai.com/tz",
        href: "http://djfacai.com/tz",
        displayHtml: "http://djfacai.com/tz",
      },
    ]

    const guideBaseUrls = priorityLinks.map(function (link) {
      return link.href
    })

    letterNow.forEach(function (item) {
      guideBaseUrls.push(`https://www.dj166${item}.com`)
    })

    function withPopupOpen(url) {
      return url.replace(/\/$/, "") + "/?popup=open"
    }

    function pickRandomGuideHref() {
      const index = Math.floor(Math.random() * guideBaseUrls.length)
      return withPopupOpen(guideBaseUrls[index])
    }

    const guideLink = document.getElementById("first-link")
    if (guideLink) {
      guideLink.href = pickRandomGuideHref()
      guideLink.addEventListener("click", function () {
        guideLink.href = pickRandomGuideHref()
      })
    }

    function appendListRow(titleNo, copyText, href, displayHtml) {
      htmlContent += `
        <div class="row center list">
            <div class="col-sm-8 col-xs-5">
                <img src="./img/logo.png" class="logo" alt="">
                <span class="title">大奖官方地址 ${titleNo} </span>
                <span class="list-domain">${displayHtml}</span>
            </div>
            <div class="col-sm-2 col-xs-3">
                <a href="javascript:void(0);" class="copy" data-text="${copyText}">
                    <img src="./img/copy.png" class="copy-img" alt="">
                </a>
            </div>
            <div class="col-sm-2 col-xs-4">
                <a href="${href}"><img src="./img/link.png" class="link" alt=""></a>
            </div>
        </div>
      `
    }

    priorityLinks.forEach(function (link) {
      listIndex += 1
      appendListRow(listIndex, link.copyText, link.href, link.displayHtml)
    })

    letterNow.forEach(function (item) {
      listIndex += 1
      const domain = `www.dj166${item}.com`
      const fullUrl = `https://www.dj166${item}.com`
      const displayHtml = `www.dj166<span class="item">${item}</span>.com`

      appendListRow(listIndex, domain, fullUrl, displayHtml)
    })

    container.innerHTML = htmlContent

    const copyToast = document.getElementById("copy-toast")
    let copyToastTimer = null

    function showCopyToast() {
      if (!copyToast) return
      clearTimeout(copyToastTimer)
      copyToast.hidden = false
      document.documentElement.classList.add("copy-toast-open")
      copyToastTimer = setTimeout(function () {
        copyToast.hidden = true
        document.documentElement.classList.remove("copy-toast-open")
      }, 1500)
    }

    if (copyToast) {
      copyToast.addEventListener("click", function () {
        copyToast.hidden = true
        document.documentElement.classList.remove("copy-toast-open")
        clearTimeout(copyToastTimer)
      })
    }

    function copyText(textToCopy) {
      navigator.clipboard
        .writeText(textToCopy)
        .then(function () {
          showCopyToast()
        })
        .catch(function () {
          const tempInput = document.createElement("input")
          tempInput.value = textToCopy
          document.body.appendChild(tempInput)
          tempInput.select()
          document.execCommand("copy")
          document.body.removeChild(tempInput)
          showCopyToast()
        })
    }

    container.addEventListener("click", function (event) {
      const copyBtn = event.target.closest(".copy")

      if (copyBtn) {
        event.preventDefault()
        copyText(copyBtn.getAttribute("data-text"))
      }
    })

  })
</script>
